name: Publish new build
run-name: "Publish new images for ${{ github.ref_name }}, env: ${{ inputs.deploy_environment }}, triggered by ${{ github.actor }}; version: ${{ inputs.version || 'N/A'}}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Enter the version number"
        required: true
      deploy_environment:
        required: false
        description: "Select the environment to deploy to"
        type: choice
        options:
          - none
          - staging
        default: none

permissions:
  contents: write

jobs:
  build-and-publish:
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/build-docker-image.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  trigger-staging-deploy:
    runs-on: ubuntu-latest
    needs:
      - build-and-publish
    if: ${{ inputs.version != '' && inputs.deploy_environment != 'none' }}
    steps:
      - name: Trigger ${{ inputs.deploy_environment }} deploy
        uses: neti-filplus-infra/filplus-deploy-action@main
        with:
          version: ${{ inputs.version }}
          environment: ${{ inputs.deploy_environment }}
          ecr-repository: fpv-indexer
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_IMAGE_DEPLOYER }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_IMAGE_DEPLOYER }}
          aws-region: us-east-1
